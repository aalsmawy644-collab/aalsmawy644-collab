<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 900 420" width="100%" role="img"
     aria-label="Amgad AL-samawi — profile header" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Amgad AL-samawi — Full-Stack &amp; Deep Learning Developer</title>

  <!--
    ================== كيف أضع صورتي؟ ==================
    ابحث في الأسفل عن العنصر <image id="PROFILE_IMAGE_URL" ... xlink:href="...">
    واستبدل قيمة xlink:href برابط raw للصورة من مستودعك، مثال:
    https://raw.githubusercontent.com/aalsmawy644-collab/aalsmawy644-collab/main/assets/me.jpg
    ملاحظة: GitHub لا يحمّل صورًا خارجية داخل SVG في بعض الحالات، فالأضمن
    تحويل الصورة إلى Base64 ووضعها هكذا:
    xlink:href="data:image/jpeg;base64,/9j/4AAQSkZJRg..."
    (أمر التحويل: base64 -w 0 me.jpg > me.txt)
    ====================================================
  -->

  <style>
    .mono { font-family: "JetBrains Mono","Fira Code","SFMono-Regular",
             "DejaVu Sans Mono",Consolas,"Liberation Mono",Menlo,monospace; }
    .ln   { font-size: 12.0px; letter-spacing: 0; }
    .k    { fill: #22d3ee; }
    .d    { fill: #cbd5e1; }
    .v    { fill: #334155; }
    .hdr  { font-size: 11px; fill: #94a3b8; letter-spacing: .5px; }
    .foot { font-size: 10.5px; fill: #94a3b8; }
    .sep  { stroke: #e2e8f0; stroke-width: 1; }
    .lead { stroke: #cbd5e1; stroke-width: 1.4; stroke-linecap: round;
             stroke-dasharray: 0.2 4.6; }
    .chrome-txt { font-size: 10.5px; fill: #94a3b8; }
    .tag  { font-size: 10px; fill: #94a3b8; letter-spacing: 1px; }
    .panel-title { font-size: 12.5px; fill: #334155; font-weight: 600; letter-spacing: .6px; }
    .live { font-size: 10px; fill: #ef4444; letter-spacing: .8px; }
    .bracket { stroke: #22d3ee; stroke-width: 2.4; fill: none; stroke-linecap: square; }
    @media (prefers-color-scheme: dark) {
      .win { fill: #0f172a; }
      .bar { fill: #1e293b; }
      .v, .panel-title { fill: #e2e8f0; }
      .d { fill: #334155; }
      .sep { stroke: #1e293b; }
    }
  </style>

  <defs>
    <clipPath id="photoClip">
      <rect x="40" y="68" width="244" height="292" rx="6"/>
    </clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g class="mono" filter="url(#soft)">
    <!-- نافذة -->
    <rect class="win" x="10" y="10" width="880" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <path class="bar" d="M10 24a14 14 0 0 1 14-14h852a14 14 0 0 1 14 14v14H10z" fill="#f8fafc"/>
    <line x1="10" y1="44" x2="890" y2="44" stroke="#e2e8f0" stroke-width="1"/>

    <!-- أزرار macOS -->
    <circle cx="34" cy="27" r="5.5" fill="#ff5f57"/>
    <circle cx="54" cy="27" r="5.5" fill="#febc2e"/>
    <circle cx="74" cy="27" r="5.5" fill="#28c840"/>

    <!-- عنوان الشريط -->
    <text class="chrome-txt" x="450.0" y="31" text-anchor="middle">aalsmawy644@gmail.com — 0 ./profile.sh --live</text>
  </g>

